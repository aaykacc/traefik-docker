version: '3'

services:
    traefik:
        image: traefik:latest
        container_name: traefik
        command:
            - --api.insecure=false  # Disable insecure access to the API and Dashboard
            - --providers.docker=true
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.web.http.redirections.entryPoint.to=websecure
            - --entrypoints.web.http.redirections.entryPoint.scheme=https
            - --certificatesresolvers.myresolver.acme.email=example@example.com  # Email for Let's Encrypt
            - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
            - --certificatesresolvers.myresolver.acme.httpchallenge=true
            - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
            - --log.level=DEBUG
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./letsencrypt:/letsencrypt
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.example.com`)"  # Dashboard domain
            - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
            - "traefik.http.routers.traefik-dashboard.tls.certresolver=myresolver"
            - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"
            - "traefik.http.routers.http-catchall.entrypoints=web"
            - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
            # Basic Auth for Dashboard (replace with your own hash)
            # Note: when used in docker-compose.yml all dollar signs in the hash need to be doubled for escaping.
            # To create a user:password pair, the following command can be used:
            # echo $(htpasswd -nb user password) | sed -e s/\\$/\\$\\$/g
            - "traefik.http.routers.traefik-dashboard.middlewares=auth"
            - "traefik.http.middlewares.auth.basicauth.users=admin:$apr1$xxxxxxxx$yyyyyyyyyyyyyyyyyyyyyyyy"
        networks:
            - ingress-controller

networks:
    ingress-controller:
        external: true